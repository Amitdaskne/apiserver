<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIT - Video Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0A0A0F; color: #00F0FF; font-family: 'VT323', monospace; margin: 0; padding: 20px; min-height: 100vh; }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: 10; }
        h2 { text-align: center; color: #FF0055; text-transform: uppercase; letter-spacing: 2px; font-size: 36px; text-shadow: 0 0 10px #FF0055; }
        .link-loader { max-width: 600px; margin: 0 auto 30px auto; display: flex; gap: 10px; position: relative; z-index: 20; }
        .link-loader input { flex: 1; padding: 10px; background: #141420; border: 1px solid #00F0FF; color: #39FF14; font-family: 'VT323', monospace; font-size: 20px; outline: none; }
        .link-loader button { padding: 0 20px; font-family: 'VT323', monospace; font-size: 20px; background: #00F0FF; border: none; cursor: pointer; }
        .video-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; position: relative; z-index: 20; }
        .video-item { background: #141420; padding: 15px; border: 2px solid #00F0FF; cursor: pointer; text-align: center; transition: 0.3s; word-break: break-all; font-size: 18px; animation: glitch 2s infinite; }
        .video-item:hover { background: #1f1f33; box-shadow: 0 0 15px #00F0FF; transform: scale(1.05); }
        @keyframes glitch { 0% { transform: translate(0) } 2% { transform: translate(-2px, 2px) } 4% { transform: translate(-2px, -2px) } 6% { transform: translate(2px, 2px) } 8% { transform: translate(2px, -2px) } 10% { transform: translate(0) } 100% { transform: translate(0) } }
        .player-container { display: none; max-width: 800px; margin: 0 auto; border: 2px solid #FF0055; box-shadow: 0 0 20px #FF0055; background: #000; position: relative; z-index: 20; }
        video { width: 100%; display: block; }
        .close-btn { background: #FF0055; color: #fff; border: none; padding: 15px; width: 100%; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <h2>[ Available Streams ]</h2>
    
    <div class="link-loader" id="loaderSection">
        <label for="amtFile" style="background:#00F0FF; color:#000; padding:10px; cursor:pointer; font-size:20px;">LOAD link.amit</label>
        <input type="file" id="amtFile" accept=".amit" onchange="loadAmt(event)" />
        <button onclick="manualUrl()">MANUAL</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center; color: #00F0FF; font-size: 24px;">Scanning server...</div>
    <div class="video-list hidden" id="videoList"></div>

    <div class="player-container" id="playerContainer">
        <video id="mainVideo" controls autoplay preload="metadata"></video>
        <button class="close-btn" onclick="closePlayer()">[ CLOSE STREAM ]</button>
    </div>

    <script>
        let API_URL = "";

        function loadAmt(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                API_URL = evt.target.result.trim();
                document.getElementById('loaderSection').classList.add('hidden');
                document.getElementById('loading').classList.remove('hidden');
                loadVideos();
            };
            reader.readAsText(file);
        }

        function manualUrl() {
            const url = prompt("Enter Cloudflare URL:");
            if(url) {
                API_URL = url.trim();
                document.getElementById('loaderSection').classList.add('hidden');
                document.getElementById('loading').classList.remove('hidden');
                loadVideos();
            }
        }

        async function loadVideos() {
            const list = document.getElementById('videoList');
            const loading = document.getElementById('loading');
            list.classList.remove('hidden');
            
            try {
                const res = await fetch(API_URL + "/api/videos");
                const data = await res.json();
                loading.classList.add('hidden');
                list.innerHTML = "";

                if (data.videos.length === 0) {
                    list.innerHTML = "<div style='color:#FF0055; font-size:20px;'>No videos found. Upload from admin!</div>";
                    return;
                }

                data.videos.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'video-item';
                    div.innerText = file;
                    div.onclick = () => playVideo(file);
                    list.appendChild(div);
                });
            } catch (err) {
                loading.style.color = "#FF0055";
                loading.innerText = "❌ Server offline or link expired.";
            }
        }

        function playVideo(filename) {
            const player = document.getElementById('playerContainer');
            const video = document.getElementById('mainVideo');
            video.src = API_URL + "/api/play?file=" + encodeURIComponent(filename);
            player.style.display = "block";
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function closePlayer() {
            const player = document.getElementById('playerContainer');
            const video = document.getElementById('mainVideo');
            video.pause();
            video.src = "";
            player.style.display = "none";
        }
    </script>
</body>
</html>
